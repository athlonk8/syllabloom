name: personal-ai-learning-os

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    environment:
      PALO_DATA_DIR: /data
      PALO_FRONTEND_DIST: /app/frontend-dist
      PALO_FRONTEND_ORIGINS: http://localhost:8080
      PALO_YOUTUBE_API_KEY: ${PALO_YOUTUBE_API_KEY:-}
      PALO_AI_PROVIDER: ${PALO_AI_PROVIDER:-codex_cli}
      PALO_AI_BASE_URL: ${PALO_AI_BASE_URL:-}
      PALO_AI_MODEL: ${PALO_AI_MODEL:-}
      PALO_AI_API_KEY: ${PALO_AI_API_KEY:-}
    volumes:
      - palo-data:/data

volumes:
  palo-data:
