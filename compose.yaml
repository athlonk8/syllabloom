name: syllabloom

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    environment:
      SYLLABLOOM_DATA_DIR: /data
      SYLLABLOOM_FRONTEND_DIST: /app/frontend-dist
      SYLLABLOOM_FRONTEND_ORIGINS: http://localhost:8080
      SYLLABLOOM_YOUTUBE_API_KEY: ${SYLLABLOOM_YOUTUBE_API_KEY:-}
      SYLLABLOOM_AI_PROVIDER: ${SYLLABLOOM_AI_PROVIDER:-codex_cli}
      SYLLABLOOM_AI_BASE_URL: ${SYLLABLOOM_AI_BASE_URL:-}
      SYLLABLOOM_AI_MODEL: ${SYLLABLOOM_AI_MODEL:-}
      SYLLABLOOM_AI_API_KEY: ${SYLLABLOOM_AI_API_KEY:-}
    volumes:
      - syllabloom-data:/data

volumes:
  syllabloom-data:
